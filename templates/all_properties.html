<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tüm İlanlar - Akıllı Park & Emlak</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --tech-dark: #0f172a;
            --tech-card: rgba(30, 41, 59, 0.7);
            --tech-neon: #0ea5e9;
            --tech-glow: rgba(14, 165, 233, 0.3);
        }
        body { 
            background-color: var(--tech-dark); 
            color: #f8fafc;
            background-image: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.1), transparent 50%);
        }
        .navbar { background: rgba(15, 23, 42, 0.9) !important; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .page-header { background: transparent; color: white; padding: 100px 0 40px; margin-top: 50px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Şık Karanlık Kart */
        .property-card {
            background: var(--tech-card); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease; 
            overflow: hidden;
            color: #fff;
        }
        .property-card:hover { 
            transform: translateY(-8px); 
            border-color: rgba(14, 165, 233, 0.4);
            box-shadow: 0 15px 40px var(--tech-glow); 
        }
        .card-img-wrapper { position: relative; overflow: hidden; height: 220px; }
        .card-img-top { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .property-card:hover .card-img-top { transform: scale(1.08); }
        
        .price-badge { font-size: 1.4rem; font-weight: 800; color: #fff; }
        .listing-type-badge { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 6px 12px; border-radius: 8px; }
        .feature-icon { color: var(--tech-neon); width: 25px; text-align: center; }
        .card-body { padding: 25px; }
        hr { border-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-city me-2"></i>Akıllı Park & Emlak</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/all-properties">Tüm İlanlar</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recommendations">Öneriler</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container text-center">
            <h1 class="display-5 fw-bold">Tüm İlanlar</h1>
            <p class="lead">Veritabanımızdaki en güncel ilanları keşfedin</p>
        </div>
    </section>

    <main class="container my-5">
        <div id="loading-indicator" class="text-center py-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Yükleniyor...</span>
            </div>
            <p class="mt-3">İlanlar yükleniyor...</p>
        </div>

        <div id="no-results" class="text-center py-5" style="display: none;">
            <h3><i class="fas fa-search-minus"></i> Hiç ilan bulunamadı.</h3>
            <p>Lütfen daha sonra tekrar deneyin veya veritabanınıza ilan ekleyin.</p>
        </div>

        <div id="properties-list-container" class="row g-4">
            </div>
    </main>

    <script>
        // Sayfa yüklendiğinde bu fonksiyon çalışır
        document.addEventListener('DOMContentLoaded', function() {
            fetchProperties();
        });

        // API'den ilanları çeken fonksiyon
        async function fetchProperties() {
            const container = document.getElementById('properties-list-container');
            const loading = document.getElementById('loading-indicator');
            const noResults = document.getElementById('no-results');

            try {
                const response = await fetch('/api/properties?limit=150'); // API adresimiz
                if (!response.ok) {
                    throw new Error('Veri çekilemedi: ' + response.statusText);
                }
                const data = await response.json();

                loading.style.display = 'none'; // Yükleniyor göstergesini gizle

                if (data.status === 'success' && data.properties && data.properties.length > 0) {
                    // Her bir ilan için kart oluştur ve ekrana bas
                    data.properties.forEach(prop => {
                        const cardHtml = createPropertyCard(prop);
                        container.insertAdjacentHTML('beforeend', cardHtml);
                    });
                } else {
                    noResults.style.display = 'block'; // İlan yoksa mesajı göster
                }

            } catch (error) {
                console.error('API Hatası:', error);
                loading.style.display = 'none';
                noResults.style.display = 'block';
                noResults.innerHTML = '<h3><i class="fas fa-server"></i> Bir hata oluştu.</h3><p>İlanlar yüklenirken bir sorunla karşılaşıldı.</p>';
            }
        }

        // Tek bir ilan kartı HTML'i oluşturan fonksiyon
        // all_properties.html içindeki script etiketinin içinde

        function createPropertyCard(prop) {
            // İlanın tipini kontrol et (satılık mı, kiralık mı?)
            const isForRent = prop.listing_type === 'rent';
            
            // Gösterilecek fiyatı ve etiketi belirle
            const displayPrice = isForRent ? prop.rent_price : prop.price;
            const priceLabel = isForRent ? '/ay' : '';
            const typeBadgeClass = isForRent ? 'bg-info text-dark' : 'bg-primary text-white';
            const imageUrl = prop.image || 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600&q=80';
            // ZİLLOW/MİA TEKNOLOJİ TARZI HTML (YAZILAR BEYAZ YAPILDI)
            return `
                <div class="col-md-6 col-lg-4" data-aos="fade-up">
                    <div class="card property-card h-100">
                        <div class="card-img-wrapper">
                            <img src="${imageUrl}" class="card-img-top" alt="${prop.title}" onerror="this.src='https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600&q=80'">
                            <div class="position-absolute top-0 end-0 m-3">
                                <span class="badge ${typeBadgeClass} listing-type-badge shadow" style="border: 1px solid rgba(255,255,255,0.3);">${prop.listing_type === 'rent' ? 'Kiralık' : 'Satılık'}</span>
                            </div>
                            <div class="position-absolute bottom-0 start-0 w-100 p-3" style="background: linear-gradient(to top, rgba(15,23,42,0.95), transparent);">
                                <h5 class="card-title mb-0 fw-bold text-white text-truncate" title="${prop.title}">${prop.title}</h5>
                            </div>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <p class="card-text small mb-4" style="color: #94a3b8;">
                                <i class="fas fa-map-marker-alt text-danger me-1"></i>${prop.district}, ${prop.province}
                            </p>
                            
                            <div class="d-flex justify-content-between my-2 text-center" style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px 5px;">
                                <div>
                                    <i class="fas fa-vector-square feature-icon d-block mb-1"></i>
                                    <strong class="text-white" style="font-size:0.9rem;">${prop.m2} m²</strong>
                                </div>
                                <div style="border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); padding: 0 15px;">
                                    <i class="fas fa-door-open feature-icon d-block mb-1"></i>
                                    <strong class="text-white" style="font-size:0.9rem;">${prop.totalrooms} Oda</strong>
                                </div>
                                <div>
                                    <i class="fas fa-bath feature-icon d-block mb-1"></i>
                                    <strong class="text-white" style="font-size:0.9rem;">${prop.bathroom_count} Banyo</strong>
                                </div>
                            </div>
                            
                            <div class="mt-auto">
                                <hr style="border-color: rgba(255,255,255,0.1);">
                                <div class="d-flex justify-content-between align-items-end">
                                    <div>
                                        <div class="price-badge" style="color: var(--tech-neon); text-shadow: 0 0 10px rgba(14,165,233,0.3);">${formatCurrency(displayPrice)}${priceLabel ? '<span style="font-size:0.8rem; color:#94a3b8;">/ay</span>' : ''}</div>
                                        ${!isForRent ? `<small style="color: #10b981; font-weight:600;"><i class="fas fa-arrow-trend-up me-1"></i>Tahmini Kira: ${formatCurrency((prop.price || 0)/200)}</small>` : ''}
                                    </div>
                                    <a href="/property/${prop.id}" class="btn btn-sm" style="background: var(--tech-blue); color: #fff; border-radius: 8px; font-weight: 600; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2);">
                                        İncele <i class="fas fa-arrow-right ms-1"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        // Sayıları para formatına çeviren yardımcı fonksiyon
        function formatCurrency(amount) {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(amount || 0);
        }
    </script>
</body>
</html>
